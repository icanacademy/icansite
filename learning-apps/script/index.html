<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PERS Story Script App</title>
    <style>
      :root { --ink:#243028; --muted:#647064; --leaf:#425843; --sage:#6f8569; --cream:#f7f3eb; --clay:#a95d3b; --line:rgba(36,48,40,.14); }
      * { box-sizing: border-box; }
      body { margin:0; color:var(--ink); font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(180deg,var(--cream),#fff); line-height:1.6; }
      a { color:inherit; text-decoration:none; }
      main { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:38px 0 66px; }
      .top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:44px; }
      .brand { font-weight:900; letter-spacing:.12em; }
      .back { display:inline-flex; align-items:center; min-height:40px; padding:0 14px; border-radius:6px; color:#fff; background:var(--leaf); font-weight:800; }
      h1 { max-width:780px; margin:0; font-size:clamp(2.3rem,7vw,5.2rem); line-height:1; }
      .lead { max-width:760px; margin:22px 0 30px; color:var(--muted); font-size:1.08rem; word-break:keep-all; }
      .workspace { display:grid; grid-template-columns:.9fr 1.1fr; gap:18px; }
      .panel { padding:24px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.84); box-shadow:0 16px 42px rgba(36,48,40,.08); }
      label { display:grid; gap:7px; margin-bottom:14px; color:var(--leaf); font-weight:900; }
      select, textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:12px; font:inherit; color:var(--ink); background:#fff; }
      textarea { min-height:120px; resize:vertical; }
      button { min-height:42px; padding:0 14px; border:0; border-radius:6px; color:#fff; background:var(--leaf); font-weight:900; cursor:pointer; }
      .script { min-height:320px; padding:18px; border-radius:8px; background:#eef4e8; color:var(--ink); white-space:pre-line; }
      .hint { margin-top:14px; color:var(--muted); }
      @media (max-width:860px) { .workspace { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <a class="brand" href="../../">PERS ACADEMY</a>
        <a class="back" href="../">학습앱 목록</a>
      </div>
      <h1>스토리를 만드는 스크립트 앱</h1>
      <p class="lead">책에서 읽은 장면을 아이가 말할 수 있는 짧은 발표 스크립트로 바꾸는 앱 슬롯입니다.</p>
      <section class="workspace">
        <form class="panel" id="scriptForm">
          <label>캐릭터
            <select id="character">
              <option>a brave child</option>
              <option>a curious rabbit</option>
              <option>a tiny robot</option>
            </select>
          </label>
          <label>장소
            <select id="place">
              <option>in a quiet library</option>
              <option>under a big tree</option>
              <option>on a little moon</option>
            </select>
          </label>
          <label>문제
            <select id="problem">
              <option>finds a lost sound</option>
              <option>needs a new friend</option>
              <option>cannot open a magic book</option>
            </select>
          </label>
          <label>선생님 메모
            <textarea id="memo" placeholder="예: 더 크게 말하기, 마지막 문장 천천히 말하기"></textarea>
          </label>
          <button type="submit">스크립트 만들기</button>
        </form>
        <article class="panel">
          <h2>발표 스크립트</h2>
          <div class="script" id="scriptOutput">왼쪽에서 요소를 고르고 스크립트를 만들어 보세요.</div>
          <p class="hint">이 화면은 수업용 초안입니다. 추후 저장, 학생별 포트폴리오, 선생님 피드백 기능을 연결할 수 있습니다.</p>
        </article>
      </section>
    </main>
    <script>
      document.getElementById("scriptForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const character = document.getElementById("character").value;
        const place = document.getElementById("place").value;
        const problem = document.getElementById("problem").value;
        const memo = document.getElementById("memo").value.trim();
        document.getElementById("scriptOutput").textContent =
          `Hello, my name is ${character}.\nToday, I am ${place}.\nI have a problem. I ${problem}.\nI think, I try, and I ask for help.\nAt the end, I learn something new.\n\nTeacher note: ${memo || "Practice with a clear voice and a happy ending."}`;
      });
    </script>
  </body>
</html>
