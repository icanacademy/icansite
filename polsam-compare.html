<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>히어로 이미지 비교 — ICAN Academy</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Apple SD Gothic Neo', sans-serif; background:#0e0e1a; color:#fff; padding:40px 20px; }
    h1 { text-align:center; font-size:1.4rem; margin-bottom:8px; color:#aac4ff; }
    p  { text-align:center; font-size:0.9rem; color:#666; margin-bottom:40px; }

    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; max-width:1400px; margin:0 auto; }

    .card { background:#161626; border-radius:16px; overflow:hidden; border:2px solid #2a2a4a; transition:border-color .2s; }
    .card:hover { border-color:#3a6bff; }
    .card img { width:100%; display:block; aspect-ratio:16/7; object-fit:cover; }
    .card-label {
      padding:16px 20px;
      font-size:0.88rem;
      color:#aac4ff;
      display:flex; align-items:center; justify-content:space-between;
    }
    .card-label strong { font-size:1rem; color:#fff; }

    .pick-btn {
      display:block; margin:12px 16px 16px;
      background:#1a3dff; color:#fff;
      border:none; border-radius:8px;
      padding:10px; font-size:0.9rem; font-weight:700;
      cursor:pointer; text-align:center;
      text-decoration:none;
      transition:background .15s;
    }
    .pick-btn:hover { background:#0033dd; }

    .note { text-align:center; margin-top:40px; font-size:0.85rem; color:#555; }
  </style>
</head>
<body>
  <h1>히어로 이미지 3가지 비교</h1>
  <p>마음에 드는 버전을 클릭하면 미리보기 페이지에 적용됩니다</p>

  <div class="grid">
    <div class="card">
      <img src="images/polsam-hero.jpg" alt="버전 1" />
      <div class="card-label"><div><strong>버전 1</strong><br>원본 생성</div></div>
      <a class="pick-btn" href="polsam-preview.html?img=v1" onclick="setImg('v1');return false;">이 이미지 선택</a>
    </div>
    <div class="card">
      <img src="images/polsam-hero-v2.jpg" alt="버전 2" />
      <div class="card-label"><div><strong>버전 2</strong><br>리얼리스틱 강화</div></div>
      <a class="pick-btn" href="#" onclick="setImg('v2');return false;">이 이미지 선택</a>
    </div>
    <div class="card">
      <img src="images/polsam-hero-v3.jpg" alt="버전 3" />
      <div class="card-label"><div><strong>버전 3</strong><br>골든아워 인테리어</div></div>
      <a class="pick-btn" href="#" onclick="setImg('v3');return false;">이 이미지 선택</a>
    </div>
  </div>

  <p class="note">선택 후 아래 미리보기로 확인하세요 → <a href="polsam-preview.html" id="preview-link" style="color:#6699ff">polsam-preview.html</a></p>

  <script>
    const map = { v1:'polsam-hero.jpg', v2:'polsam-hero-v2.jpg', v3:'polsam-hero-v3.jpg' };
    function setImg(v) {
      localStorage.setItem('heroImg', map[v]);
      document.getElementById('preview-link').textContent = '→ 미리보기 열기 (이미지: ' + map[v] + ')';
      alert('선택 완료! 미리보기 링크를 클릭하세요.\n(또는 선택한 이미지 파일 이름을 알려주시면 HTML에 바로 반영해 드립니다)');
    }
  </script>
</body>
</html>
